site_name: Buy Crypto Press Release FAQ Generator
site_url: https://buy-crypto-pressrelease-faq-generator.readthedocs.io/
site_description: Search 50 official BuyCryptoPressRelease.com FAQs in plain English. Get the best answer with a 0 to 100 confidence score, and generate the FAQ as Markdown, JSON, FAQPage schema or HTML.
site_author: BuyCryptoPressRelease.com
repo_url: https://github.com/buycryptopressrelease/buy-crypto-pressrelease-faq-generator
repo_name: buycryptopressrelease/buy-crypto-pressrelease-faq-generator
theme:
  name: material
  palette:
    primary: black
    accent: amber
  features:
    - navigation.sections
    - toc.integrate
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
